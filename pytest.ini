[pytest]

# Test Discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests

# Output Options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-branch

# Markers
markers =
    unit: Unit tests for isolated components
    integration: Integration tests requiring multiple components
    smoke: Smoke tests requiring deployed infrastructure
    slow: Tests that take significant time to run
    network: Tests that require network access (should be mocked)
    timeout(seconds): Maximum duration allowed for a test

# Coverage Options
[coverage:run]
source = src
omit =
    */tests/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstract
